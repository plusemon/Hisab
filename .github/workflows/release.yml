name: Release Android APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate or Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Print SHA-1 fingerprint
        run: keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

      - name: Decode release keystore
        run: |
          SECRET_KEYSTORE="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -n "$SECRET_KEYSTORE" ]; then
            echo -n "$SECRET_KEYSTORE" | base64 -d > hisab-release.keystore 2>/dev/null || echo -n "$SECRET_KEYSTORE" | base64 --decode > hisab-release.keystore 2>/dev/null || true
          fi

      - name: Print release SHA-1 fingerprint
        run: keytool -list -v -keystore hisab-release.keystore -alias hisab -storepass "${{ secrets.STORE_PASSWORD }}" -keypass "${{ secrets.KEY_PASSWORD }}" | grep "SHA1:"

      - name: Write google-services.json
        run: |
          mkdir -p app
          SECRET_VAL="${{ secrets.GOOGLE_SERVICES_JSON }}"
          if echo -n "$SECRET_VAL" | base64 --decode > app/google-services.json 2>/dev/null; then
            if ! grep -q "{" app/google-services.json; then
              echo -n "$SECRET_VAL" > app/google-services.json
            fi
          else
            echo -n "$SECRET_VAL" > app/google-services.json
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build optimized release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/hisab-release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: hisab
        run: |
          VERSION_TAG="${{ steps.version.outputs.version }}"
          VERSION_NO_V=$(echo "$VERSION_TAG" | sed 's/^[vV]*//')
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${VERSION_NO_V}

      - name: Rename APK
        run: |
          mkdir -p build-outputs
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-outputs/hisab-${{ steps.version.outputs.version }}.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk build-outputs/hisab-${{ steps.version.outputs.version }}.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk build-outputs/hisab-${{ steps.version.outputs.version }}.apk
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: build-outputs/hisab-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
          prerelease: true
