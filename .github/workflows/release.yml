name: Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate or Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Write google-services.json
        run: |
          mkdir -p app
          SECRET_VAL="${{ secrets.GOOGLE_SERVICES_JSON }}"
          if echo -n "$SECRET_VAL" | base64 --decode > app/google-services.json 2>/dev/null; then
            if ! grep -q "{" app/google-services.json; then
              echo -n "$SECRET_VAL" > app/google-services.json
            fi
          else
            echo -n "$SECRET_VAL" > app/google-services.json
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p build-outputs
          cp app/build/outputs/apk/debug/app-debug.apk build-outputs/Hisab-${{ github.ref_name }}.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: build-outputs/Hisab-${{ github.ref_name }}.apk
          generate_release_notes: true
