name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore password'
        required: true
        type: string
      key_password:
        description: 'Key password'
        required: true
        type: string

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Mask sensitive inputs
        run: |
          echo "::add-mask::${{ inputs.store_password }}"
          echo "::add-mask::${{ inputs.key_password }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v -keystore hisab-release.keystore -alias hisab -keyalg RSA -keysize 2048 -validity 10000 -storepass "${{ inputs.store_password }}" -keypass "${{ inputs.key_password }}" -dname "CN=Hisab,O=Hisab,C=BD"

      - name: Upload release keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: hisab-release.keystore
